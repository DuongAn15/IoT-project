name: CI & Secret Scan

on:
  push:
    branches: [master, main, 'feat/**', 'docs/**']
  pull_request:
    branches: [master, main]

jobs:
  secret-scan:
    name: Check tracked secrets and gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure sensitive env/credential files are never tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$|serviceAccountKey\.json$'; then
            echo "ERROR: Sensitive env or serviceAccountKey file is tracked in Git!"
            exit 1
          fi
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-test:
    name: Backend Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install, build, and test backend
        working-directory: adht-weather-backend
        run: |
          bun install --frozen-lockfile
          bun run build
          node --test test/*.test.cjs

  flutter-test:
    name: Flutter Analyze & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - name: Analyze and test Flutter app
        working-directory: adht-weather-app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  firmware-build:
    name: Firmware PlatformIO Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO and build
        working-directory: adht-weather-firmware
        run: |
          pip install -U platformio
          pio run
