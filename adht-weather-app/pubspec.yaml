name: weather_monitoring
description: "Cross-platform Weather Monitoring Mobile Application with interactive charts and offline SQLite cache."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Charts & Visualization
  fl_chart: ^0.70.0

  # Local SQLite Database (7-Day Offline Cache)
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0

  # Networking & HTTP
  dio: ^5.7.0

  # UI, Fonts & Effects
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.6

flutter:
  uses-material-design: true
